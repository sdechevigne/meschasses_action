name: Captures montre — App Store

# Captures vitrine de l'app watchOS pour la fiche App Store de « Mes Chasses ».
# PAS d'envoi à App Store Connect : la montre n'est pas encore embarquée dans
# les builds TestFlight/store ; les PNG sortent uniquement en artifact
# (téléchargement manuel ensuite).
#
# Structure en 2 étages :
#   1. `build` : compile une seule fois l'app watchOS Debug (watchsimulator),
#      publie `MesChassesWatch.app` en artifact entre jobs.
#   2. `shoot` : matrice par taille de montre, un runner macOS FRAIS par
#      taille. Chaque matrice télécharge l'app pré-bâtie et lance le script
#      `watch-captures-store.sh` avec `ONLY_SIZE=<taille>`.
#
# Pourquoi la matrice : runs 40755759111 → 40765721013 ont montré qu'un
# même runner ne peut traiter de façon fiable qu'UN SEUL device watchOS —
# le CoreSimulatorService perd le lien aux runtime bundles après le 1er
# cycle, et aucun redémarrage de daemon ne le ramène proprement (le runtime
# devient « Invalid runtime »). Avec un runner frais par taille, chaque
# capture a son CoreSimulatorService neuf, pas de contamination.

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "SHA complet ou branche du monorepo (vide = branche par défaut)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: captures-montre-app-store-${{ inputs.monorepo_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Étage 1 : compilation de l'app watchOS Debug. Même socle que
  # `watch-tests.yml` (checkout monorepo, Expo prebuild MESCHASSES_WATCH=1,
  # pod install, xcodebuild Debug de MesChassesWatch), suivi d'un
  # upload-artifact de l'application.
  # ---------------------------------------------------------------------------
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    environment: production

    env:
      RCT_USE_PREBUILT_RNCORE: "1"
      RCT_USE_RN_DEP: "1"
      RCT_REACT_NATIVE_MAVEN_MIRROR_ENABLED: "1"
      RCT_SKIP_CACHES: "0"

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          ref: ${{ inputs.monorepo_ref }}

      - name: Trace du commit testé
        run: |
          echo "Commit monorepo : $(git -C app rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode 27.1
        run: |
          XCODE_PATH=/Applications/Xcode_27.1.app
          [ -d "$XCODE_PATH" ] || { echo "::error::Xcode 27.1 introuvable ($XCODE_PATH)"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (Node 20)
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-watch-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pods-watch-${{ runner.os }}-

      - name: Cache React Native prebuilt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/ReactNative
          key: rn-prebuilt-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            rn-prebuilt-${{ runner.os }}-

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: Expo prebuild (iOS, MESCHASSES_WATCH=1)
        working-directory: app/apps/mobile
        env:
          MESCHASSES_WATCH: "1"
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          npx expo prebuild --platform ios --no-install --non-interactive --clean

      - name: pod install
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          for i in 1 2 3; do
            if pod install; then
              echo "pod install OK à la tentative $i" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "pod install a échoué (tentative $i/3), nouvelle tentative dans 30s..."
            sleep 30
          done
          echo "::error::pod install a échoué 3 fois (voir logs plus haut : CDN RN)"
          exit 1

      - name: xcodebuild build — MesChassesWatch (app montre, Debug)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-app" \
            OBJROOT="$PWD/build-app/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      # Upload de MesChassesWatch.app pour que les jobs `shoot` ne refassent
      # pas le build. L'app en Debug fait ~10 Mo.
      - name: Zip MesChassesWatch.app
        working-directory: app/apps/mobile/ios/build-app/Debug-watchsimulator
        run: zip -r "$GITHUB_WORKSPACE/MesChassesWatch.app.zip" MesChassesWatch.app

      - name: Upload artifact MesChassesWatch.app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-app-debug
          path: MesChassesWatch.app.zip
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Étage 2 : capture, une matrice par taille → un runner macOS frais par
  # device. Chaque matrice reconstruit un simulateur unique de SA taille et
  # exécute `watch-captures-store.sh` avec `ONLY_SIZE=<label>` : le script
  # saute toutes les autres tailles. Le runner frais garantit un
  # CoreSimulatorService propre, condition observée nécessaire au bon boot.
  # ---------------------------------------------------------------------------
  shoot:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        size: [49mm-ultra, 46mm, 45mm, 41mm]

    steps:
      - name: Select Xcode 27.1
        run: |
          XCODE_PATH=/Applications/Xcode_27.1.app
          [ -d "$XCODE_PATH" ] || { echo "::error::Xcode 27.1 introuvable ($XCODE_PATH)"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Checkout scripts CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ci

      - name: Download MesChassesWatch.app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watch-app-debug
          path: ${{ github.workspace }}/app-zip

      - name: Unzip app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app-bundle"
          unzip -q "$GITHUB_WORKSPACE/app-zip/MesChassesWatch.app.zip" -d "$GITHUB_WORKSPACE/app-bundle"
          ls -la "$GITHUB_WORKSPACE/app-bundle/MesChassesWatch.app" | head -5

      - name: Captures taille ${{ matrix.size }}
        timeout-minutes: 20
        env:
          WATCH_APP_PATH: ${{ github.workspace }}/app-bundle/MesChassesWatch.app
          OUTDIR: ${{ github.workspace }}/watch-captures-app-store
          ONLY_SIZE: ${{ matrix.size }}
        run: bash "${{ github.workspace }}/ci/.github/scripts/watch-captures-store.sh"

      - name: Upload artifact watch-captures-app-store (${{ matrix.size }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Un artifact par taille → le téléchargement local les concatène.
          # `watch-captures-app-store-<taille>` au lieu d'un dossier commun :
          # upload-artifact v4 interdit l'écriture concurrente sur un même nom.
          name: watch-captures-app-store-${{ matrix.size }}
          path: watch-captures-app-store/*
          if-no-files-found: error
          retention-days: 30
