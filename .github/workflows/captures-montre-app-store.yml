name: Captures montre — App Store

# Captures vitrine de l'app watchOS pour la fiche App Store de « Mes Chasses ».
# PAS d'envoi à App Store Connect : la montre n'est pas encore embarquée dans
# les builds TestFlight/store ; les PNG sortent uniquement en artifact
# (téléchargement manuel ensuite).
#
# Un seul job sur un runner macOS : même socle que `watch-tests.yml`
# (checkout monorepo + Expo prebuild `MESCHASSES_WATCH=1` + pod install +
# xcodebuild Debug `MesChassesWatch` pour `watchsimulator`), puis script
# `watch-captures-store.sh` qui essaie successivement toutes les tailles
# disponibles sur le runner (Ultra 49 mm, Series 46 mm, Series 45 mm,
# Series 41 mm) et prend 18 écrans × 2 langues (fr, en) sur la fixture
# `store` (DemoMode.swift) : 01 home, 02 hunt, 03 huntActions, 04 post,
# 05 card, 06 permit, 07 permitFull (partie basse), 08 horns, 09 battue2TraqueOn,
# 10 battue2Paused, 11 signalSpecies, 12 signalStatus, 13 signalReminder,
# 14 settings, 15 homeBottom, 16 homeStale, puis les deux variantes en mode
# atténué (poignet baissé, argument Debug `-dimmed`) : 17 battue2TraqueOnDimmed,
# 18 homeDimmed (liste détaillée : en-tête de `watch-captures-store.sh`).
#
# Historique :
# - Un refactor en matrice (1 job par taille) a été tenté (runs 40768506954
#   & 40772340007) : chaque matrice tombait en « runtime watchOS indisponible »
#   ou « cannot determine the runtime bundle » après la 1re install, et
#   aucune parade n'a tenu. Un job mono-runner multi-tailles (comme
#   watch-tests.yml) reste la configuration qui marche le mieux ; il livre
#   au moins 2 tailles proprement (Ultra 49 mm + Series 46 mm), c'est déjà
#   ce que l'App Store Connect exige.

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "SHA complet ou branche du monorepo (vide = branche par défaut)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: captures-montre-app-store-${{ inputs.monorepo_ref || github.ref }}
  cancel-in-progress: true

jobs:
  captures:
    runs-on: xcode-27
    timeout-minutes: 110
    environment: production

    env:
      RCT_USE_PREBUILT_RNCORE: "1"
      RCT_USE_RN_DEP: "1"
      RCT_REACT_NATIVE_MAVEN_MIRROR_ENABLED: "1"
      RCT_SKIP_CACHES: "0"

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          ref: ${{ inputs.monorepo_ref }}

      - name: Trace du commit testé
        run: |
          echo "Commit monorepo : $(git -C app rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode 27.1
        run: |
          XCODE_PATH=/Applications/Xcode_27.1.app
          [ -d "$XCODE_PATH" ] || { echo "::error::Xcode 27.1 introuvable ($XCODE_PATH)"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Télécharger le runtime watchOS si manquant
        # Xcode 27.1 sur ce runner ne vient plus avec le runtime watchOS préinstallé
        # (`xcrun simctl list runtimes watchOS` renvoyait une liste vide, run 40969326562
        # échouait avec « Aucun runtime watchOS disponible »). On tente d'abord la
        # version qui va avec Xcode 27.1 (watchOS 11), puis on retente sans contrainte
        # de version si ça n'a pas été résolu.
        run: |
          set -o pipefail
          if xcrun simctl list runtimes watchOS -j | node -e '(() => {
            const r = JSON.parse(require("fs").readFileSync(0,"utf8")).runtimes || [];
            if (r.filter(x => x.isAvailable !== false).length === 0) process.exit(2);
          })()'; then
            echo "runtime watchOS déjà disponible" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "## Téléchargement du runtime watchOS" | tee -a "$GITHUB_STEP_SUMMARY"
            xcodebuild -downloadPlatform watchOS 2>&1 | tail -5 | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::téléchargement du runtime watchOS a échoué"
            xcrun simctl list runtimes watchOS | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (Node 20)
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-watch-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pods-watch-${{ runner.os }}-

      - name: Cache React Native prebuilt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/ReactNative
          key: rn-prebuilt-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            rn-prebuilt-${{ runner.os }}-

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: Expo prebuild (iOS, MESCHASSES_WATCH=1)
        working-directory: app/apps/mobile
        env:
          MESCHASSES_WATCH: "1"
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          npx expo prebuild --platform ios --no-install --non-interactive --clean

      - name: pod install
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          for i in 1 2 3; do
            if pod install; then
              echo "pod install OK à la tentative $i" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "pod install a échoué (tentative $i/3), nouvelle tentative dans 30s..."
            sleep 30
          done
          echo "::error::pod install a échoué 3 fois (voir logs plus haut : CDN RN)"
          exit 1

      - name: xcodebuild build — MesChassesWatch (app montre, Debug)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-app" \
            OBJROOT="$PWD/build-app/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      - name: Checkout scripts CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ci

      - name: Captures simulateur watchOS pour App Store
        working-directory: app/apps/mobile/ios
        timeout-minutes: 50
        env:
          WATCH_APP_PATH: ${{ github.workspace }}/app/apps/mobile/ios/build-app/Debug-watchsimulator/MesChassesWatch.app
          OUTDIR: ${{ github.workspace }}/watch-captures-app-store
        run: bash "${{ github.workspace }}/ci/.github/scripts/watch-captures-store.sh"

      - name: Upload artifact watch-captures-app-store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-captures-app-store
          path: watch-captures-app-store/*
          if-no-files-found: error
          retention-days: 30
