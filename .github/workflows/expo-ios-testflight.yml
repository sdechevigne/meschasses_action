name: Expo iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Note interne"
        required: false
        default: ""
      monorepo_ref:
        description: "Branche (ou tag/SHA) du monorepo à construire — vide = branche par défaut"
        required: false
        default: ""
      destination:
        description: "test = TestFlight seul ; production = soumission App Store + publication auto après validation"
        type: choice
        options: [test, production]
        default: test
      watch:
        description: "Inclure les cibles watchOS (app montre + complications) — JAMAIS en production tant que la montre n'est pas validée."
        type: boolean
        default: false
  push:
    tags:
      - "tf-v*"

# Repo PUBLIC : le GITHUB_TOKEN n'est utilisé par aucun step (le checkout du
# monorepo passe par CI_PAT_TOKEN). On lui retire donc TOUT droit sur ce repo.
permissions: {}

# Un build de test ne doit jamais annuler une mise en production en cours
# (groupes séparés), et une mise en production n'est jamais annulée en vol.
concurrency:
  group: expo-ios-testflight-${{ inputs.destination || 'test' }}
  cancel-in-progress: ${{ inputs.destination != 'production' }}

jobs:
  # Lit la version d'Expo du commit à construire AVANT de choisir la machine : un SDK ≥ 58 doit être
  # compilé avec Xcode 27.1 (SDK iOS 27, iPhone Duo) ; un SDK plus ancien plante au lancement s'il l'est
  # (cycle UIScene exigé par iOS 27). Rien à choisir à la main, aucun mélange possible.
  socle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      expo_major: ${{ steps.lire.outputs.expo_major }}
    steps:
      - name: Checkout monorepo (package.json mobile seul)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          # Même règle que le job de build : vide = branche par défaut du monorepo.
          ref: ${{ inputs.monorepo_ref }}
          sparse-checkout: apps/mobile/package.json
          sparse-checkout-cone-mode: false
      - name: Version d'Expo
        id: lire
        run: |
          M=$(node -p 'require("./app/apps/mobile/package.json").dependencies.expo.replace(/^[^0-9]*/,"").split(".")[0]')
          [[ "$M" =~ ^[0-9]+$ ]] || { echo "::error::Version d'Expo illisible dans apps/mobile/package.json ($M)"; exit 1; }
          echo "expo_major=$M" >> "$GITHUB_OUTPUT"
          echo "Expo SDK $M" >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    needs: socle
    runs-on: ${{ fromJSON(needs.socle.outputs.expo_major) >= 58 && 'xcode-27' || 'macos-15' }}
    timeout-minutes: 150
    environment: production
    # Lecture de CE repo (public) uniquement, pour le script d'annotation
    # TestFlight. Le monorepo continue de passer par CI_PAT_TOKEN.
    permissions:
      contents: read

    steps:
      # Checkout du monorepo (pnpm/Turborepo) via un PAT dédié.
      # L'app Expo vit dans app/apps/mobile ; la racine workspace est app/.
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          # Vide (push de tag, ou champ laissé vide) = branche par défaut du monorepo.
          # Passé via `with:` (jamais interpolé dans un `run:`) : pas d'injection shell.
          ref: ${{ inputs.monorepo_ref }}

      # Trace build -> commit : le SHA du monorepo est capturé ICI (avant toute
      # modification du working tree par les steps suivants) et réinjecté plus bas
      # dans le champ "What to Test" du build TestFlight.
      # Repo PUBLIC : la valeur passe par GITHUB_OUTPUT puis par `env:` — jamais
      # par un `run:` interpolé, dont GitHub affiche le script rendu dans les logs.
      - name: Capture commit du monorepo
        id: meta
        run: |
          {
            echo "commit_sha=$(git -C app rev-parse HEAD)"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      # Scripts CI de CE repo (public) : checkout sans token, dans ci/ pour ne
      # pas toucher au monorepo déjà présent dans app/.
      - name: Checkout scripts CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ci

      # PRODUCTION : contrôles AVANT toute minute de build (branche par défaut ou
      # commit précis déjà intégré à celle-ci,
      # nouveautés présentes et ≤ 500 caractères, version > version en ligne,
      # aucune version déjà en cours chez Apple, locales couvertes).
      - name: Contrôles mise en production
        if: inputs.destination == 'production'
        env:
          MONOREPO_REF: ${{ inputs.monorepo_ref }}
          MONOREPO_REPO: ${{ secrets.MONOREPO_REPO }}
          MONOREPO_TOKEN: ${{ secrets.CI_PAT_TOKEN }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.meschasses' }}
          CHECK_ONLY: "1"
        run: |
          node ci/.github/scripts/verifier-mise-en-prod.mjs
          node ci/.github/scripts/publish-app-store.mjs

      # Expo ≥ 58 → Xcode 27.1 (runner xcode-27) ; sinon dernier Xcode 26 (macos-15).
      # Le runtime simulateur iOS 27.1 n'est PAS nécessaire pour une archive appareil.
      - name: Select Xcode
        env:
          EXPO_MAJOR: ${{ needs.socle.outputs.expo_major }}
        run: |
          if [ "$EXPO_MAJOR" -ge 58 ]; then
            XCODE_PATH=/Applications/Xcode_27.1.app
          else
            XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          [ -d "$XCODE_PATH" ] || { echo "::error::Xcode introuvable ($XCODE_PATH) pour Expo $EXPO_MAJOR"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      # pnpm DOIT être installé avant setup-node pour que cache: pnpm fonctionne.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (Node 20)
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Cache CocoaPods : évite de re-télécharger les podspecs à chaque build
      # (eas build --local fait pod install dans un dossier temporaire mais réutilise
      # ces caches utilisateur). Clé sur le lockfile JS = proxy des versions natives.
      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Install à la RACINE du workspace : installe aussi packages/core.
      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Le bundle id com.meschasses est PARTAGÉ avec l'app live ; le buildNumber
      # doit dépasser le dernier uploadé sur TestFlight (322 au moment du setup).
      # github.run_number repart à 1 pour ce workflow -> OFFSET 400 = 1er build 401.
      - name: Compute build number
        id: bn
        env:
          OFFSET: "400"
        run: |
          BN=$(( ${{ github.run_number }} + OFFSET ))
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"

      # Cible le app.json de l'app Expo dans le monorepo.
      - name: Inject build number
        run: |
          node -e '
            const fs = require("fs");
            const p = "app/apps/mobile/app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const bn = process.env.BUILD_NUMBER;
            j.expo.ios = j.expo.ios || {};
            j.expo.android = j.expo.android || {};
            j.expo.ios.buildNumber = String(bn);
            j.expo.android.versionCode = Number(bn);
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '

      # Clé App Store Connect API passée à eas-cli en NON-INTERACTIF : lui permet
      # de créer ses profils de distribution tout seul (nouveaux bundles comme la
      # montre watchOS). SANS cette étape, eas lève
      # `InsufficientAuthenticationNonInteractiveError` sur toute nouvelle cible
      # (SetUpProvisioningProfile.js / CreateProvisioningProfile.js lus dans
      # eas-cli 26.0.0). La clé .p8 vit uniquement dans $HOME/private_keys, dossier
      # effacé par le step final « Wipe build outputs », et sa valeur est masquée
      # ligne à ligne avant écriture.
      - name: Prepare ASC API key for EAS (non-interactive signing)
        id: asc_key
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          [ -n "$ASC_KEY_ID" ]      || { echo "::error::APPSTORE_API_KEY_ID manquant"; exit 1; }
          [ -n "$ASC_PRIVATE_KEY" ] || { echo "::error::APPSTORE_API_PRIVATE_KEY manquant"; exit 1; }
          while IFS= read -r l; do
            [ -n "$l" ] && echo "::add-mask::$l"
          done <<< "$ASC_PRIVATE_KEY"
          umask 077
          KEY_DIR="$HOME/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR" && chmod 700 "$KEY_DIR"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          openssl pkey -in "$KEY_FILE" -noout 2>/dev/null \
            || { echo "::error::APPSTORE_API_PRIVATE_KEY invalide (ni PEM ni base64 de PEM)"; exit 1; }
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"

      # Avant tout build qui introduit un NOUVEAU bundle iOS (ici les cibles
      # watchOS), on amorce ses credentials côté Apple + côté Expo. Sans cela,
      # eas-cli non-interactif échoue sur `MissingCredentialsNonInteractiveError`
      # (SetUpDistributionCertificate.runNonInteractiveAsync) : il ne tente
      # jamais de réutiliser un cert existant pour un bundle nouvellement
      # rencontré. Le script crée côté ASC les bundleIds + un IOS_APP_STORE
      # provisioning profile lié au MÊME certificat de distribution que celui
      # qu'utilise déjà `com.meschasses`, télécharge le `.mobileprovision`, puis
      # l'enregistre côté Expo via les mutations GraphQL `createApple*` /
      # `createIosAppBuildCredentials`. Idempotent : réexécution = no-op.
      - name: Amorce credentials watch (ASC + Expo GraphQL)
        if: inputs.watch == true
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY_PATH: ${{ steps.asc_key.outputs.key_file }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APP_ID: "723bb511-987b-4d04-983b-40dfa4929bba"
          EXPO_APPLE_TEAM_ID: "B77M2F5M8R"
          PRIMARY_BUNDLE: "com.meschasses"
          TARGET_BUNDLES: "com.meschasses.watchkitapp com.meschasses.watchkitapp.complications"
        run: node ci/.github/scripts/prime-watch-credentials.mjs

      # eas build --local s'exécute dans apps/mobile. Sortie écrite dans app/
      # (../../app-store.ipa depuis apps/mobile) pour rester hors de l'app.
      # Variables EXPO_PUBLIC_* mappées sur les secrets existants (réutilisés).
      - name: Build .ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          # Bundle id partagé avec l'app live : ne PAS laisser EAS désactiver les
          # capabilities (push/apple-auth/associated-domains) déjà actives en prod.
          EXPO_NO_CAPABILITY_SYNC: "1"
          # Cibles watchOS incluses UNIQUEMENT si l'input watch est coché. Lu par
          # apps/mobile/app.config.js au prebuild (filtre @bacons/apple-targets).
          MESCHASSES_WATCH: ${{ inputs.watch == true && '1' || '0' }}
          # Autorise eas-cli à parler à App Store Connect sans prompt (clé API
          # d'équipe, Issuer ID requis). Lu par resolveCredentials.js d'eas-cli.
          EXPO_ASC_API_KEY_PATH: ${{ steps.asc_key.outputs.key_file }}
          EXPO_ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          # Dérive le team Apple sans prompt (eas-cli demande sinon).
          EXPO_APPLE_TEAM_ID: "B77M2F5M8R"
          # Compte Apple Developer Program de « Mes Chasses » = organisation.
          # Si l'équipe était INDIVIDUAL, le job échouerait tôt avec un message
          # clair — à corriger ici (3 valeurs possibles : IN_HOUSE / COMPANY_OR_ORGANIZATION / INDIVIDUAL).
          EXPO_APPLE_TEAM_TYPE: "COMPANY_OR_ORGANIZATION"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          # Analytics PostHog — clé inlinée dans le bundle (projet commun web+mobile,
          # distingué par la super-prop platform). Garde __DEV__ inactive en build prod.
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # Crash reporting Sentry — DSN inliné dans le bundle (EXPO_PUBLIC_*).
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENV: "production"
          # Upload des source maps pendant le build : le config plugin
          # @sentry/react-native injecte une phase sentry-cli (Xcode) qui lit ces
          # variables d'env. SANS elles, les stack traces restent minifiées. org EU.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          cd app/apps/mobile
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output ../../app-store.ipa

      # Garde-fou AVANT envoi : toute bibliothèque liée doit être fournie par iOS
      # ou embarquée dans l'app, sinon plantage au lancement (dyld « Library
      # missing », avant tout JS). Vécu 4.2.10 (757) : prébuild expo-contacts
      # 56.0.14 lié à Swift Testing.
      - name: Contrôle des bibliothèques liées (.ipa)
        run: bash ci/.github/scripts/verifier-liens-ipa.sh app/app-store.ipa

      # Contrôle Watch (.ipa) : le flag `watch` du dispatch doit faire la LOI.
      # - watch=false → aucun dossier Watch/ embarqué (zero fuite vers un build store).
      # - watch=true  → présence d'un dossier Payload/*.app/Watch/*.app contenant à
      #   la fois l'app montre et son extension de complications (PlugIns/*.appex).
      - name: Contrôle Watch (.ipa)
        env:
          WATCH_ENABLED: ${{ inputs.watch == true && '1' || '0' }}
        run: |
          set -euo pipefail
          IPA="app/app-store.ipa"
          [ -f "$IPA" ] || { echo "::error::$IPA introuvable"; exit 1; }
          WATCH_ENTRIES=$(unzip -l "$IPA" | awk '{print $NF}' | grep -E '^Payload/[^/]+\.app/Watch/' || true)
          if [ "$WATCH_ENABLED" = "1" ]; then
            if [ -z "$WATCH_ENTRIES" ]; then
              echo "::error::watch=true mais aucun Watch/ dans le .ipa"
              exit 1
            fi
            WATCH_APP=$(printf '%s\n' "$WATCH_ENTRIES" | grep -E '^Payload/[^/]+\.app/Watch/[^/]+\.app/' | head -1 || true)
            WATCH_APPEX=$(printf '%s\n' "$WATCH_ENTRIES" | grep -E '^Payload/[^/]+\.app/Watch/[^/]+\.app/PlugIns/[^/]+\.appex/' | head -1 || true)
            [ -n "$WATCH_APP" ]   || { echo "::error::App montre manquante dans Watch/"; exit 1; }
            [ -n "$WATCH_APPEX" ] || { echo "::error::Extension de complications manquante dans Watch/*.app/PlugIns/"; exit 1; }
            echo "Watch/ présent : $WATCH_APP + $WATCH_APPEX"
          else
            if [ -n "$WATCH_ENTRIES" ]; then
              echo "::error::watch=false mais Watch/ présent dans le .ipa"
              printf '%s\n' "$WATCH_ENTRIES" | head -20
              exit 1
            fi
            echo "Watch/ absent (watch=false) — OK"
          fi

      # Aucun iPhone ne doit perdre l'app : minimum iOS de l'app et de ses frameworks inchangé (16.4).
      # Le widget (extension) a sa propre version (18.0, inchangée depuis sa création).
      - name: Contrôle des versions minimales (.ipa)
        env:
          MIN_IOS: "16.4"
          EXTENSIONS_IOS: "MesChassesWidgets.appex=18.0"
        run: node ci/.github/scripts/verifier-minimums.mjs ios app/app-store.ipa

      # Upload DIRECT vers App Store Connect depuis le runner (xcrun altool), sans
      # passer par la file d'attente des submissions EAS (qui ajoutait souvent
      # plusieurs dizaines de minutes au job pour un simple transfert de binaire).
      # altool ne fait QUE l'upload : il ne poll pas le statut de traitement, donc
      # le 401 de l'ancienne action apple-actions (JWT expiré pendant le poll)
      # ne peut pas se reproduire.
      #
      # REPO PUBLIC — contraintes tenues par ce step :
      #  - la clé .p8 est écrite dans $HOME/private_keys (HORS du workspace) :
      #    impossible qu'elle finisse dans l'archive `eas build --local`, dans un
      #    commit local ou dans un artifact ;
      #  - dossier en 0700 / fichier en 0600, effacé par un `trap` même si altool
      #    échoue ou si le job est annulé (le wipe final est la 2e ceinture) ;
      #  - chaque ligne du PEM est passée à ::add-mask:: avant toute écriture (le
      #    masquage auto de GitHub est fiable sur une valeur mono-ligne, pas sur un
      #    secret multi-ligne) ;
      #  - aucune valeur de secret n'est echo, pas de `set -x`, pas de --verbose :
      #    les logs publics ne contiennent que le statut de l'upload.
      #
      # Secrets réutilisés (déjà présents dans l'environment production, hérités de
      # l'ancien workflow ios-build.yml) : APPSTORE_API_KEY_ID / APPSTORE_ISSUER_ID /
      # APPSTORE_API_PRIVATE_KEY (PEM brut OU base64, les deux sont gérés). altool
      # cherche la clé sous le nom AuthKey_<KEY_ID>.p8 — imposé par Apple.
      - name: Upload to TestFlight (App Store Connect)
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          [ -n "$ASC_KEY_ID" ]      || { echo "::error::APPSTORE_API_KEY_ID manquant"; exit 1; }
          [ -n "$ASC_ISSUER_ID" ]   || { echo "::error::APPSTORE_ISSUER_ID manquant"; exit 1; }
          [ -n "$ASC_PRIVATE_KEY" ] || { echo "::error::APPSTORE_API_PRIVATE_KEY manquant"; exit 1; }

          # Masque chaque ligne du PEM (secret multi-ligne) avant tout traitement.
          while IFS= read -r l; do
            [ -n "$l" ] && echo "::add-mask::$l"
          done <<< "$ASC_PRIVATE_KEY"

          umask 077
          KEY_DIR="$HOME/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR" && chmod 700 "$KEY_DIR"
          trap 'rm -f "$KEY_FILE"' EXIT

          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          openssl pkey -in "$KEY_FILE" -noout 2>/dev/null \
            || { echo "::error::APPSTORE_API_PRIVATE_KEY invalide (ni PEM ni base64 de PEM)"; exit 1; }

          xcrun altool --upload-app \
            --type ios \
            --file app/app-store.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Écrit "Build <n> — commit <sha>" dans le champ "What to Test" du build
      # TestFlight (betaBuildLocalizations.whatsToTest, API App Store Connect).
      # But : pouvoir dire « le 603 bugue, pas le 602 » et retrouver la plage de
      # commits entre les deux, directement depuis TestFlight.
      # Le script attend l'apparition du build côté Apple (traitement : 2 à 20 min),
      # régénère son JWT à chaque requête, et ne fait JAMAIS échouer le job : le
      # binaire est déjà livré, seule l'annotation peut manquer (warning).
      - name: Annoter le build TestFlight (commit)
        if: success()
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.meschasses' }}
          BUILD_NUMBER: ${{ steps.bn.outputs.build_number }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          COMMIT_REF: ${{ github.ref }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTFLIGHT_LOCALES: "fr-FR,en-US"
          POLL_TIMEOUT_SEC: "1200"
        run: node ci/.github/scripts/set-testflight-whats-to-test.mjs

      # PRODUCTION : attend le traitement Apple du build, remplit les nouveautés
      # (store/nouveautes/<version>/ du monorepo), rattache le build et soumet à
      # la validation, avec publication AUTOMATIQUE à 100 % après acceptation.
      - name: Soumettre à l'App Store
        if: success() && inputs.destination == 'production'
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.meschasses' }}
          BUILD_NUMBER: ${{ steps.bn.outputs.build_number }}
          POLL_TIMEOUT_SEC: "2700"
        run: node ci/.github/scripts/publish-app-store.mjs

      # Rien n'est conservé : ni artifact (aucun upload-artifact dans ce workflow),
      # ni binaire, ni clé. Le .ipa signé ne va QUE vers App Store Connect.
      # Le runner est détruit de toute façon — ceci est la 2e ceinture après le trap.
      - name: Wipe build outputs
        if: always()
        run: |
          rm -f app/app-store.ipa
          rm -rf ~/private_keys
