name: Expo iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Note interne"
        required: false
        default: ""
  push:
    tags:
      - "tf-v*"

# Repo PUBLIC : le GITHUB_TOKEN n'est utilisé par aucun step (le checkout du
# monorepo passe par CI_PAT_TOKEN). On lui retire donc TOUT droit sur ce repo.
permissions: {}

concurrency:
  group: expo-ios-testflight
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: macos-15
    timeout-minutes: 90
    environment: production
    # Lecture de CE repo (public) uniquement, pour le script d'annotation
    # TestFlight. Le monorepo continue de passer par CI_PAT_TOKEN.
    permissions:
      contents: read

    steps:
      # Checkout du monorepo (pnpm/Turborepo) via un PAT dédié.
      # L'app Expo vit dans app/apps/mobile ; la racine workspace est app/.
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app

      # Trace build -> commit : le SHA du monorepo est capturé ICI (avant toute
      # modification du working tree par les steps suivants) et réinjecté plus bas
      # dans le champ "What to Test" du build TestFlight.
      # Repo PUBLIC : la valeur passe par GITHUB_OUTPUT puis par `env:` — jamais
      # par un `run:` interpolé, dont GitHub affiche le script rendu dans les logs.
      - name: Capture commit du monorepo
        id: meta
        run: |
          {
            echo "commit_sha=$(git -C app rev-parse HEAD)"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26.x
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::Xcode 26.x not found on runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      # pnpm DOIT être installé avant setup-node pour que cache: pnpm fonctionne.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Cache CocoaPods : évite de re-télécharger les podspecs à chaque build
      # (eas build --local fait pod install dans un dossier temporaire mais réutilise
      # ces caches utilisateur). Clé sur le lockfile JS = proxy des versions natives.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Install à la RACINE du workspace : installe aussi packages/core.
      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Le bundle id com.meschasses est PARTAGÉ avec l'app live ; le buildNumber
      # doit dépasser le dernier uploadé sur TestFlight (322 au moment du setup).
      # github.run_number repart à 1 pour ce workflow -> OFFSET 400 = 1er build 401.
      - name: Compute build number
        id: bn
        env:
          OFFSET: "400"
        run: |
          BN=$(( ${{ github.run_number }} + OFFSET ))
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"

      # Cible le app.json de l'app Expo dans le monorepo.
      - name: Inject build number
        run: |
          node -e '
            const fs = require("fs");
            const p = "app/apps/mobile/app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const bn = process.env.BUILD_NUMBER;
            j.expo.ios = j.expo.ios || {};
            j.expo.android = j.expo.android || {};
            j.expo.ios.buildNumber = String(bn);
            j.expo.android.versionCode = Number(bn);
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '

      # eas build --local s'exécute dans apps/mobile. Sortie écrite dans app/
      # (../../app-store.ipa depuis apps/mobile) pour rester hors de l'app.
      # Variables EXPO_PUBLIC_* mappées sur les secrets existants (réutilisés).
      - name: Build .ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          # Bundle id partagé avec l'app live : ne PAS laisser EAS désactiver les
          # capabilities (push/apple-auth/associated-domains) déjà actives en prod.
          EXPO_NO_CAPABILITY_SYNC: "1"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          # Analytics PostHog — clé inlinée dans le bundle (projet commun web+mobile,
          # distingué par la super-prop platform). Garde __DEV__ inactive en build prod.
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # Crash reporting Sentry — DSN inliné dans le bundle (EXPO_PUBLIC_*).
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENV: "production"
          # Upload des source maps pendant le build : le config plugin
          # @sentry/react-native injecte une phase sentry-cli (Xcode) qui lit ces
          # variables d'env. SANS elles, les stack traces restent minifiées. org EU.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          cd app/apps/mobile
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output ../../app-store.ipa

      # Upload DIRECT vers App Store Connect depuis le runner (xcrun altool), sans
      # passer par la file d'attente des submissions EAS (qui ajoutait souvent
      # plusieurs dizaines de minutes au job pour un simple transfert de binaire).
      # altool ne fait QUE l'upload : il ne poll pas le statut de traitement, donc
      # le 401 de l'ancienne action apple-actions (JWT expiré pendant le poll)
      # ne peut pas se reproduire.
      #
      # REPO PUBLIC — contraintes tenues par ce step :
      #  - la clé .p8 est écrite dans $HOME/private_keys (HORS du workspace) :
      #    impossible qu'elle finisse dans l'archive `eas build --local`, dans un
      #    commit local ou dans un artifact ;
      #  - dossier en 0700 / fichier en 0600, effacé par un `trap` même si altool
      #    échoue ou si le job est annulé (le wipe final est la 2e ceinture) ;
      #  - chaque ligne du PEM est passée à ::add-mask:: avant toute écriture (le
      #    masquage auto de GitHub est fiable sur une valeur mono-ligne, pas sur un
      #    secret multi-ligne) ;
      #  - aucune valeur de secret n'est echo, pas de `set -x`, pas de --verbose :
      #    les logs publics ne contiennent que le statut de l'upload.
      #
      # Secrets réutilisés (déjà présents dans l'environment production, hérités de
      # l'ancien workflow ios-build.yml) : APPSTORE_API_KEY_ID / APPSTORE_ISSUER_ID /
      # APPSTORE_API_PRIVATE_KEY (PEM brut OU base64, les deux sont gérés). altool
      # cherche la clé sous le nom AuthKey_<KEY_ID>.p8 — imposé par Apple.
      - name: Upload to TestFlight (App Store Connect)
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          [ -n "$ASC_KEY_ID" ]      || { echo "::error::APPSTORE_API_KEY_ID manquant"; exit 1; }
          [ -n "$ASC_ISSUER_ID" ]   || { echo "::error::APPSTORE_ISSUER_ID manquant"; exit 1; }
          [ -n "$ASC_PRIVATE_KEY" ] || { echo "::error::APPSTORE_API_PRIVATE_KEY manquant"; exit 1; }

          # Masque chaque ligne du PEM (secret multi-ligne) avant tout traitement.
          while IFS= read -r l; do
            [ -n "$l" ] && echo "::add-mask::$l"
          done <<< "$ASC_PRIVATE_KEY"

          umask 077
          KEY_DIR="$HOME/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR" && chmod 700 "$KEY_DIR"
          trap 'rm -f "$KEY_FILE"' EXIT

          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          openssl pkey -in "$KEY_FILE" -noout 2>/dev/null \
            || { echo "::error::APPSTORE_API_PRIVATE_KEY invalide (ni PEM ni base64 de PEM)"; exit 1; }

          xcrun altool --upload-app \
            --type ios \
            --file app/app-store.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Le script d'annotation vit dans CE repo (public) : checkout sans token,
      # dans ci/ pour ne pas toucher au monorepo déjà présent dans app/.
      - name: Checkout scripts CI
        if: success()
        uses: actions/checkout@v4
        with:
          path: ci

      # Écrit "Build <n> — commit <sha>" dans le champ "What to Test" du build
      # TestFlight (betaBuildLocalizations.whatsToTest, API App Store Connect).
      # But : pouvoir dire « le 603 bugue, pas le 602 » et retrouver la plage de
      # commits entre les deux, directement depuis TestFlight.
      # Le script attend l'apparition du build côté Apple (traitement : 2 à 20 min),
      # régénère son JWT à chaque requête, et ne fait JAMAIS échouer le job : le
      # binaire est déjà livré, seule l'annotation peut manquer (warning).
      - name: Annoter le build TestFlight (commit)
        if: success()
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.meschasses' }}
          BUILD_NUMBER: ${{ steps.bn.outputs.build_number }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          COMMIT_REF: ${{ github.ref }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTFLIGHT_LOCALES: "fr-FR,en-US"
          POLL_TIMEOUT_SEC: "1200"
        run: node ci/.github/scripts/set-testflight-whats-to-test.mjs

      # Rien n'est conservé : ni artifact (aucun upload-artifact dans ce workflow),
      # ni binaire, ni clé. Le .ipa signé ne va QUE vers App Store Connect.
      # Le runner est détruit de toute façon — ceci est la 2e ceinture après le trap.
      - name: Wipe build outputs
        if: always()
        run: |
          rm -f app/app-store.ipa
          rm -rf ~/private_keys
