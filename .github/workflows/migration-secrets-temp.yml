# TEMPORAIRE (supprimé juste après usage) : recopie les secrets du dépôt dans
# l'environnement « production ». Aucune valeur n'est affichée.
name: Migration secrets vers production (temporaire)

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrer:
    runs-on: ubuntu-latest
    steps:
      - name: Recopier
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOMS: "ANDROID_GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_FILE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY APPSTORE_ISSUER_ID CI_PAT_TOKEN DEMO_PASSWORD EXPO_PUBLIC_SENTRY_DSN EXPO_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT_JSON MONOREPO_REPO SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT SENTRY_URL VITE_POSTHOG_KEY VITE_SUPABASE_KEY VITE_SUPABASE_URL"
          S_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          S_ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          S_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          S_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          S_APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          S_APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          S_APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          S_CI_PAT_TOKEN: ${{ secrets.CI_PAT_TOKEN }}
          S_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          S_EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          S_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          S_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          S_MONOREPO_REPO: ${{ secrets.MONOREPO_REPO }}
          S_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          S_SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          S_SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          S_SENTRY_URL: ${{ secrets.SENTRY_URL }}
          S_VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          S_VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          S_VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          set +x
          for n in $NOMS; do
            v="S_$n"
            if [ -z "${!v}" ]; then echo "::error::$n vide"; exit 1; fi
            gh secret set "$n" --env production --body "${!v}" > /dev/null
            echo "$n recopié"
          done
