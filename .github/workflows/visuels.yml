name: Visuels stores et réseaux

# Monte les visuels finaux (App Store, Google Play, réseaux sociaux, site vitrine) à partir des
# captures brutes, avec le moteur du monorepo : packages/store-visuals.
#
# Captures : on fournit UN OU PLUSIEURS ids de runs de captures PAR LANGUE. Chaque langue peut
# viser plusieurs runs iOS (ex. l'iPhone vient d'un run, l'iPad d'un autre) : les artifacts sont
# fusionnés côté langue AVANT le rendu. Le simulateur tournait dans la langue cible, donc les
# captures FR et EN sont dans des dossiers différents et le moteur est appelé UNE FOIS PAR LANGUE
# (un dossier captures/<langue>/ par langue, mais l'arborescence attendue par le moteur est
# <dossier>/<appareil>/NN-nom.png — on lance donc un render par langue avec --sortie dans un
# sous-dossier commun, puis on fusionne).
#
# Rendu : conteneur Playwright FIGÉ (mcr.microsoft.com/playwright:v1.56.0-noble), le même qu'en
# local. Sortie : UN artifact `visuels-<langues>` contenant toutes les langues côte à côte
# (<langue>/<cible>/NN-<scene>.png), plus la planche de relecture et le rapport.
#
# Multi-langue : une langue demandée doit fournir des captures COMPLÈTES (iPhone + iPad +
# android-tel + android-tablette, chacun avec ses NN-*.png numérotés). Une langue incomplète fait
# échouer le job AVANT le rendu, en nommant ce qui manque.

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "SHA complet ou branche du monorepo (vide = branche par défaut)"
        required: false
        default: ""
      langues:
        description: "Langues, séparées par « , » (ex. fr,en)"
        required: false
        default: "fr,en"
      cibles:
        description: "Cibles, séparées par « , » (vide = cibles des stores)"
        required: false
        default: ""
      # Un ou plusieurs ids de runs `Captures App Store` séparés par « , ». Chaque run peut couvrir
      # un ou plusieurs simulateurs (iPhone + iPad) ; les artifacts sont fusionnés.
      run_captures_ios_fr:
        description: "Id(s) de run `Captures App Store` pour le FR (vide = FR non rendu)"
        required: false
        default: ""
      run_captures_ios_en:
        description: "Id(s) de run `Captures App Store` pour l'EN (vide = EN non rendu)"
        required: false
        default: ""
      run_captures_android_fr:
        description: "Id(s) de run `Captures Android` pour le FR"
        required: false
        default: ""
      run_captures_android_en:
        description: "Id(s) de run `Captures Android` pour l'EN"
        required: false
        default: ""
      run_captures_web_fr:
        description: "Id(s) de run `Captures app web` pour le FR (vide = site-web ignoré)"
        required: false
        default: ""
      run_captures_web_en:
        description: "Id(s) de run `Captures app web` pour l'EN"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: visuels-${{ inputs.langues }}
  cancel-in-progress: true

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Les secrets MONOREPO_REPO et CI_PAT_TOKEN vivent dans l'environnement `production`
    # (cf. docs/claude/ci.md §environnement) : sans lui, le checkout du monorepo échoue
    # avec « Input required and not supplied: token » (vécu le 2026-11-28, run 46123613992).
    environment: production
    permissions:
      contents: read
      actions: read
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          ref: ${{ inputs.monorepo_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Télécharge les artifacts de TOUS les runs cités (par langue, iOS/Android/Web), sous
      # brut-<langue>-<famille>/<run_id>/. On fusionne ensuite dans captures/<langue>/<appareil>/.
      - name: Télécharger les artifacts de captures (multi-run, multi-langue)
        # bash explicite : le défaut `sh` de l'image Playwright ne connaît pas `set -o pipefail`.
        shell: bash
        env:
          IOS_FR: ${{ inputs.run_captures_ios_fr }}
          IOS_EN: ${{ inputs.run_captures_ios_en }}
          AND_FR: ${{ inputs.run_captures_android_fr }}
          AND_EN: ${{ inputs.run_captures_android_en }}
          WEB_FR: ${{ inputs.run_captures_web_fr }}
          WEB_EN: ${{ inputs.run_captures_web_en }}
          LANGUES: ${{ inputs.langues }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Pour chaque entrée « famille / langue » : liste d'ids de runs, nom d'artifact à
          # chercher, dossier cible. `jq` est présent dans l'image Playwright.
          telecharger() {
            # $1 = langue (fr/en), $2 = famille (ios/android/web), $3 = ids (liste ", ")
            local langue="$1" famille="$2" ids="$3"
            [ -z "$ids" ] && return 0
            local artefact="captures-app-store-$langue"
            case "$famille" in
              ios)     artefact="captures-app-store-$langue" ;;
              android) artefact="captures-android-$langue" ;;
              web)     artefact="captures-web-$langue" ;;
            esac
            local dest="brut-$langue-$famille"
            mkdir -p "$dest"
            local i=0
            for run in $(echo "$ids" | tr ',' ' '); do
              run="${run## }"; run="${run%% }"
              [ -z "$run" ] && continue
              i=$((i + 1))
              echo "→ run $run · $artefact"
              # L'API v4 de download-artifact ne gère pas les listes dynamiques de runs :
              # on utilise l'API REST directement, via gh.
              # (téléchargement d'un .zip puis extraction dans dest/<run>/)
              local tmp_dir="$dest/run-$i"
              mkdir -p "$tmp_dir"
              # L'image Playwright n'embarque pas `gh` : on tape directement l'API REST avec curl.
              local art_id
              art_id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$run/artifacts" \
                | python3 -c "import sys,json; a=[x for x in json.load(sys.stdin)['artifacts'] if x['name']=='$artefact']; print(a[0]['id'] if a else '')")
              if [ -z "$art_id" ]; then
                echo "::warning::Pas d'artifact « $artefact » dans le run $run — ignoré."
                continue
              fi
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$art_id/zip" \
                -o "$tmp_dir/a.zip"
              (cd "$tmp_dir" && python3 -c "import zipfile; zipfile.ZipFile('a.zip').extractall('.')" && rm a.zip)
            done
          }
          # Toutes les langues demandées : on ne télécharge que celles pour lesquelles un id est fourni.
          for langue in $(echo "$LANGUES" | tr ',' ' '); do
            langue="${langue## }"; langue="${langue%% }"
            [ -z "$langue" ] && continue
            case "$langue" in
              fr)
                telecharger fr ios "$IOS_FR"
                telecharger fr android "$AND_FR"
                telecharger fr web "$WEB_FR"
                ;;
              en)
                telecharger en ios "$IOS_EN"
                telecharger en android "$AND_EN"
                telecharger en web "$WEB_EN"
                ;;
              *)
                echo "::error::Langue inconnue « $langue » (fr, en attendus)."
                exit 1
                ;;
            esac
          done

      - name: Ranger et contrôler les captures (par langue)
        shell: bash
        env:
          LANGUES: ${{ inputs.langues }}
          CIBLES: ${{ inputs.cibles }}
        run: |
          set -euo pipefail
          mkdir -p captures
          # ranger $racine $langue $appareil_nom : copie les NN-*.png du dossier brut (sous-arbre)
          # vers captures/<langue>/<appareil_nom>/. Les captures iOS sortent par simulateur (nom
          # iPhone-… ou iPad-…) et sont redistribuées ; Android et web portent déjà android-tel,
          # android-tablette, web.
          ranger_sousdossier() {
            local src="$1" dest_dir="$2"
            mkdir -p "$dest_dir"
            find "$src" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' \
              -exec cp -n {} "$dest_dir/" \;
          }
          ranger_famille() {
            # $1 = langue, $2 = racine (brut-<langue>-<famille>), $3 = famille
            local langue="$1" racine="$2" famille="$3"
            [ -d "$racine" ] || { echo "   (pas de dossier $racine)"; return 0; }
            # La profondeur réelle dépend de l'arborescence embarquée dans le zip :
            # on cherche tout dossier d'une des catégories connues à n'importe quelle profondeur.
            while IFS= read -r d; do
              [ -d "$d" ] || continue
              base=$(basename "$d")
              case "$base" in
                iPhone*|iphone*) echo "   ranger $d → captures/$langue/iphone"; ranger_sousdossier "$d" "captures/$langue/iphone" ;;
                iPad*|ipad*)     echo "   ranger $d → captures/$langue/ipad";   ranger_sousdossier "$d" "captures/$langue/ipad" ;;
                android-tel)     echo "   ranger $d → captures/$langue/android-tel"; ranger_sousdossier "$d" "captures/$langue/android-tel" ;;
                android-tablette) echo "   ranger $d → captures/$langue/android-tablette"; ranger_sousdossier "$d" "captures/$langue/android-tablette" ;;
                web)             echo "   ranger $d → captures/$langue/web"; ranger_sousdossier "$d" "captures/$langue/web" ;;
              esac
            done < <(find "$racine" -type d \( -iname 'iPhone*' -o -iname 'iPad*' -o -name 'android-tel' -o -name 'android-tablette' -o -name 'web' \))
          }

          # Ensemble des captures iOS attendues (13 écrans, numérotés 01..13). Si ton moteur
          # exige une liste précise, elle vit dans son code ; ce contrôle n'impose QUE les
          # fichiers numérotés présents dans un dossier « bien formé ».
          doit_exister_et_etre_peuple() {
            local dossier="$1" min="$2"
            [ -d "$dossier" ] || { echo "::error::Dossier manquant : $dossier"; return 1; }
            local n
            n=$(find "$dossier" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' | wc -l)
            if [ "$n" -lt "$min" ]; then
              echo "::error::$dossier : $n captures trouvées, au moins $min attendues."
              return 1
            fi
            return 0
          }

          # Appareils exigés par les cibles demandées (vide = toutes les cibles stores).
          # Appareil mappé : apple-iphone-69/-ipad-13, google-tel/-tablette/-banniere, site-web.
          cibles_a_tester="${CIBLES:-apple-iphone-69,apple-ipad-13,google-tel,google-tablette,google-banniere}"
          appareils_requis=""
          case "$cibles_a_tester" in
            *apple-iphone-69*)  appareils_requis="$appareils_requis iphone" ;;
          esac
          case "$cibles_a_tester" in
            *apple-ipad-13*)    appareils_requis="$appareils_requis ipad" ;;
          esac
          case "$cibles_a_tester" in
            *google-tel*|*google-banniere*) appareils_requis="$appareils_requis android-tel" ;;
          esac
          case "$cibles_a_tester" in
            *google-tablette*)  appareils_requis="$appareils_requis android-tablette" ;;
          esac

          probleme=0
          for langue in $(echo "$LANGUES" | tr ',' ' '); do
            langue="${langue## }"; langue="${langue%% }"
            [ -z "$langue" ] && continue
            ranger_famille "$langue" "brut-$langue-ios"     ios
            ranger_famille "$langue" "brut-$langue-android" android
            ranger_famille "$langue" "brut-$langue-web"     web
            echo "### Captures $langue" >> "$GITHUB_STEP_SUMMARY"
            for n in $appareils_requis; do
              # Chacune des cibles stores a besoin de ses dossiers : on exige au moins 8 captures.
              if ! doit_exister_et_etre_peuple "captures/$langue/$n" 8; then
                probleme=1
              else
                nb=$(find "captures/$langue/$n" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' | wc -l)
                echo "- $n : $nb captures" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          [ "$probleme" -eq 0 ] || { echo "::error::Captures incomplètes (voir le résumé)."; exit 1; }

      - name: Rendu (une fois par langue, sorties fusionnées)
        shell: bash
        working-directory: app/packages/store-visuals
        env:
          CIBLES: ${{ inputs.cibles }}
          LANGUES: ${{ inputs.langues }}
        run: |
          set -euo pipefail
          [ -n "$CIBLES" ] && ARGS="--cibles $CIBLES" || ARGS=""
          mkdir -p "$GITHUB_WORKSPACE/visuels"
          # Un render par langue, chacun avec son propre dossier captures. Le moteur écrit dans
          # <sortie>/<langue>/<cible>/... : plusieurs langues partagent donc le même dossier sans
          # collision (les arborescences sont disjointes par langue).
          for langue in $(echo "$LANGUES" | tr ',' ' '); do
            langue="${langue## }"; langue="${langue%% }"
            [ -z "$langue" ] && continue
            # shellcheck disable=SC2086
            ../../node_modules/.bin/tsx src/cli.ts render \
              --captures "$GITHUB_WORKSPACE/captures/$langue" \
              --langues "$langue" \
              --sortie "$GITHUB_WORKSPACE/visuels" $ARGS
          done

      - name: Validation
        working-directory: app/packages/store-visuals
        env:
          CIBLES: ${{ inputs.cibles }}
        run: |
          [ -n "$CIBLES" ] && ARGS="--cibles $CIBLES" || ARGS=""
          # shellcheck disable=SC2086
          ../../node_modules/.bin/tsx src/cli.ts validate \
            --sortie "$GITHUB_WORKSPACE/visuels" --langues "${{ inputs.langues }}" $ARGS

      - name: Publication (simulation, aucune écriture)
        if: always()
        working-directory: app/packages/store-visuals
        run: |
          for store in apple google; do
            ../../node_modules/.bin/tsx src/cli.ts publish \
              --sortie "$GITHUB_WORKSPACE/visuels" --langues "${{ inputs.langues }}" --store "$store" \
              >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Artifact visuels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visuels-${{ inputs.langues }}
          path: visuels
          retention-days: 14
          if-no-files-found: error
