name: Watch Core — Swift tests

# Deux jobs indépendants :
#   • swift-test  : tests unitaires du paquet SwiftPM `apps/mobile/watch-core`
#     (modèle, stockage, PhoneLink, HomeModel, PostGuidance, QrImage, etc.).
#     Rapide — compile et exécute XCTest nativement sur macOS, sans simulateur.
#   • watch-build : compile les cibles watchOS (app montre + complications)
#     SANS signing ni upload, pour vérifier qu'une évolution Swift côté watch
#     n'a pas cassé le build Xcode des cibles réelles. Pas de TestFlight :
#     décision utilisateur, aucun binaire ne quitte le runner.
#
# La Tâche 11 étendra `watch-build` avec des captures de simulateur (via
# `-demo <fixture>` dans l'app). En attendant, un simple `xcodebuild build`
# pour `-sdk watchsimulator`.

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "Branche (ou tag/SHA) du monorepo à tester — vide = branche par défaut"
        required: false
        default: ""

permissions: {}

concurrency:
  group: watch-tests-${{ inputs.monorepo_ref || github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    # Même famille de runner que l'iOS build (Xcode 27.1, SDK watchOS 11+).
    # Le socle (choix du runner) n'est pas nécessaire ici : `swift test`
    # macOS compile le paquet avec Swift 5.9+ ; pas de dépendance au SDK iOS.
    runs-on: xcode-27
    timeout-minutes: 20
    # Les secrets `MONOREPO_REPO` + `CI_PAT_TOKEN` sont scopés à l'environnement
    # `production` (mêmes règles que l'iOS build).
    environment: production

    steps:
      # Checkout du monorepo via le même PAT que le build iOS. L'app vit dans
      # `app/apps/mobile/watch-core`.
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          ref: ${{ inputs.monorepo_ref }}

      - name: Trace du commit testé
        run: |
          echo "Commit monorepo : $(git -C app rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          swift --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: swift test --package-path apps/mobile/watch-core
        working-directory: app
        run: |
          # pipefail : sans ça, `tee` renvoie 0 et un échec de `swift test`
          # passe inaperçu (vécu le 2026-10-27, run 40588312474).
          set -o pipefail
          swift test --package-path apps/mobile/watch-core 2>&1 | tee "$GITHUB_STEP_SUMMARY"

  # Compile les cibles watchOS (app montre + complications) sans signing ni
  # upload. Objectif : valider à chaque PR qui touche aux sources Swift que
  # les cibles réelles compilent toujours — garantie que l'iOS TestFlight (le
  # jour où watch=true sera activé) ne pétera pas sur un symbole / une arch /
  # un fichier manquant. Ce job valide aussi au passage les contrats @MainActor
  # côté PhoneLink (Tâche 5) qu'un `swift test` sur macOS ne voit pas.
  watch-build:
    runs-on: xcode-27
    # 90 min : même borne d'alerte que le build iOS. L'essentiel du budget
    # part en pod install (cache froid) et compile des Pods RN la toute
    # première fois ; les runs suivants sont bornés par la compilation Swift
    # des cibles watchOS (~5-10 min).
    timeout-minutes: 90
    environment: production

    # Variables communes à tous les steps du job qui touchent aux pods ou à
    # xcodebuild. Deux rôles :
    #
    #  1) Forcer React Native à utiliser les ARTIFACTS PREBUILT (xcframework
    #     côté Dependencies, xcframework côté React-Core). Sans ces drapeaux,
    #     `pod install` tente de bâtir RN et ses dépendances C++ depuis les
    #     sources — à chaque run, sur chaque arch, pour chaque Pod. En mode
    #     prebuilt, pod télécharge un tarball une fois, le valide par SHA1,
    #     et REUTILISE le fichier posé dans `~/Library/Caches/ReactNative/`
    #     à chaque invocation ultérieure (code source :
    #     facebook/react-native@0a83e72 scripts/cocoapods/rndependencies.rb
    #     et sdks/hermes-engine/hermes-utils.rb — tous deux utilisent le
    #     même dossier `~/Library/Caches/ReactNative`).
    #  2) Activer le MIROIR Maven côté RN. L'URL d'origine (`repo1.maven.org`)
    #     a été instable sur plusieurs runs (`curl 56` / `curl 92`) ; le
    #     miroir `repo.reactnative.dev` est explicitement supporté par
    #     `ReactNativePodsUtils.maven_repository_urls` quand `RCT_REACT_NATIVE_
    #     MAVEN_MIRROR_ENABLED=1` (idem commit `0a83e72`).
    #  3) `RCT_SKIP_CACHES=0` : on VEUT que RN consulte et peuple
    #     `~/Library/Caches/ReactNative` — c'est précisément le dossier
    #     qu'`actions/cache` persiste entre runs.
    env:
      RCT_USE_PREBUILT_RNCORE: "1"
      RCT_USE_RN_DEP: "1"
      RCT_REACT_NATIVE_MAVEN_MIRROR_ENABLED: "1"
      RCT_SKIP_CACHES: "0"

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          ref: ${{ inputs.monorepo_ref }}

      - name: Trace du commit testé
        run: |
          echo "Commit monorepo : $(git -C app rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode 27.1
        run: |
          XCODE_PATH=/Applications/Xcode_27.1.app
          [ -d "$XCODE_PATH" ] || { echo "::error::Xcode 27.1 introuvable ($XCODE_PATH)"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (Node 20)
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-watch-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pods-watch-${{ runner.os }}-

      # Cache des artifacts prebuilt de React Native (xcframeworks de
      # ReactNativeDependencies et hermes-engine). Même dossier des deux côtés
      # (voir en-tête `env:`). Clé = hash du pnpm-lock + chemin natif, pour
      # qu'une bump de version RN change la clé et force un nouveau cache
      # (le podspec vérifie le SHA1, un vieux cache serait rejeté de toute
      # façon mais autant éviter l'aller-retour).
      - name: Cache React Native prebuilt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/ReactNative
          key: rn-prebuilt-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            rn-prebuilt-${{ runner.os }}-

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Prebuild Expo avec MESCHASSES_WATCH=1 pour que app.config.js étende le
      # glob @bacons/apple-targets aux cibles `watch` et `watch-widget`, et que
      # `withWatchCoreSources` copie les sources partagées dans chaque cible.
      # On ne pousse PAS plus loin que la génération du projet Xcode + pods :
      # pas de signing, pas d'archive, pas d'upload.
      - name: Expo prebuild (iOS, MESCHASSES_WATCH=1)
        working-directory: app/apps/mobile
        env:
          MESCHASSES_WATCH: "1"
          # Bundle id partagé avec l'app live : ne pas resyncer les capabilities.
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          npx expo prebuild --platform ios --no-install --non-interactive --clean

      # pod install : trois sources d'échec rencontrées sur les runs
      # précédents (40649859890, 40660281899, 40663168061) :
      #   • CDN GitHub artifacts (`React-Core-prebuilt`) qui coupe au milieu
      #     du téléchargement (`curl: (56) Recv failure`).
      #   • Miroir Maven RN (`repo.reactnative.dev`) qui ferme un stream HTTP/2
      #     avant la fin (`curl: (92) HTTP/2 stream 1 not closed cleanly`).
      #   • Téléchargement de `react-native-artifacts` qui ne finit JAMAIS
      #     (run 40663168061 : 45 min sans sortie, timeout du job).
      #
      # Les deux premiers sont rejoués ici par la boucle (3 tentatives).
      # Le troisième est désamorcé par les trois mécanismes posés plus haut :
      # miroir activé (le podspec essaie `repo1.maven.org` ET
      # `repo.reactnative.dev`), artifacts cachés entre runs
      # (`~/Library/Caches/ReactNative` dans `actions/cache`), et par la
      # suppression de `--repo-update` qui déclenchait un pull de tous les
      # podspecs à chaque run.
      - name: pod install
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          for i in 1 2 3; do
            if pod install; then
              echo "pod install OK à la tentative $i" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "pod install a échoué (tentative $i/3), nouvelle tentative dans 30s..."
            sleep 30
          done
          echo "::error::pod install a échoué 3 fois (voir logs plus haut : CDN RN)"
          exit 1

      # xcodebuild build des cibles watchOS. CODE_SIGNING_ALLOWED=NO : on
      # cherche à vérifier que ça compile, pas à produire un binaire signé.
      # `-sdk watchsimulator` évite d'avoir à sélectionner un simulateur
      # précis par son UDID.
      #
      # Pas de workspace ni de scheme : on cible le project `MesChasses.xcodeproj`
      # directement avec `-target …`. Autrement, le scheme MesChassesWatch
      # (généré par @bacons/apple-targets) trimballe toutes les dépendances
      # des Pods du projet (RN, MapLibre, Firebase, etc.) et le build dépasse
      # 45 min. Les cibles watchOS ne lient AUCUN de ces pods — un build
      # ciblé sur le target natif coupe le chemin critique.
      #
      # Deux xcodebuild distincts avec `SYMROOT` SÉPARÉS plutôt qu'un seul :
      # on veut que CHAQUE cible compile indépendamment, pour qu'une régression
      # sur `Complications.swift` ne passe pas inaperçue au prétexte que l'app
      # watch l'embarque. Chaque build écrit dans son propre dossier (
      # `build-app/` et `build-complications/`), pas de clean/collision
      # possible, et la vérif inspecte précisément les binaires de CHAQUE cible.
      - name: xcodebuild build — MesChassesWatch (app montre)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-app" \
            OBJROOT="$PWD/build-app/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      - name: xcodebuild build — MesChassesWatchComplications (complications)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatchComplications \
            -configuration Debug \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-complications" \
            OBJROOT="$PWD/build-complications/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      # Vérification explicite que les DEUX cibles ont bien produit un binaire
      # non trivial, pas seulement une archive propre : on contrôle la présence
      # des `.app` / `.appex` ET on inspecte la table de symboles avec `nm` à
      # la recherche d'un symbole Swift d'une des sources (`homeState` pour
      # l'app, `NextHuntComplicationView` / `Complication*` pour la
      # complication). Ce step tombe si xcodebuild a « réussi » sans rien
      # produire (ex. target vide, source ignorée).
      - name: Vérification des binaires watchOS produits
        working-directory: app/apps/mobile/ios
        run: |
          set -euo pipefail
          APP="build-app/Debug-watchsimulator/MesChassesWatch.app/MesChassesWatch"
          APPEX="build-complications/Debug-watchsimulator/MesChassesWatchComplications.appex/MesChassesWatchComplications"

          echo "## Binaires produits" >> "$GITHUB_STEP_SUMMARY"
          for binary in "$APP" "$APPEX"; do
            if [ ! -f "$binary" ]; then
              echo "::error::Binaire manquant : $binary"
              echo "## Arborescence build-app/ et build-complications/" >> "$GITHUB_STEP_SUMMARY"
              find build-app build-complications -maxdepth 4 -type f 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
              exit 1
            fi
            SIZE=$(stat -f%z "$binary")
            ARCHS=$(xcrun lipo -archs "$binary" 2>/dev/null || echo "?")
            echo "- $binary ($SIZE octets, archs: $ARCHS)" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "## Symboles Swift (échantillon)" >> "$GITHUB_STEP_SUMMARY"
          # app montre : `homeState(_:)` est utilisé par HomeView.
          if ! xcrun nm -gU "$APP" 2>/dev/null | grep -q "homeState"; then
            echo "::error::Symbole 'homeState' absent de l'app montre"
            exit 1
          fi
          echo "- app montre : symbole \`homeState\` présent ✓" >> "$GITHUB_STEP_SUMMARY"

          # complication : `NextHuntComplicationView` est défini dans
          # targets/watch-widget/Complications.swift.
          if ! xcrun nm -gU "$APPEX" 2>/dev/null | grep -q "Complication"; then
            echo "::error::Aucun symbole 'Complication*' dans la complication"
            exit 1
          fi
          echo "- complication : symboles \`Complication*\` présents ✓" >> "$GITHUB_STEP_SUMMARY"
