name: Watch Core — Swift tests

# Deux jobs indépendants :
#   • swift-test  : tests unitaires du paquet SwiftPM `apps/mobile/watch-core`
#     (modèle, stockage, PhoneLink, HomeModel, PostGuidance, QrImage, etc.).
#     Rapide — compile et exécute XCTest nativement sur macOS, sans simulateur.
#   • watch-build : compile les cibles watchOS (app montre + complications)
#     SANS signing ni upload, pour vérifier qu'une évolution Swift côté watch
#     n'a pas cassé le build Xcode des cibles réelles. Pas de TestFlight :
#     décision utilisateur, aucun binaire ne quitte le runner.
#
# La Tâche 11 étendra `watch-build` avec des captures de simulateur (via
# `-demo <fixture>` dans l'app). En attendant, un simple `xcodebuild build`
# pour `-sdk watchsimulator`.

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "Branche (ou tag/SHA) du monorepo à tester — vide = branche par défaut"
        required: false
        default: ""
  # Appelé depuis `expo-ios-testflight.yml` quand `watch: true` : un échec ici
  # bloque l'envoi TestFlight (le job `build-and-deploy` a `needs: watch-tests`
  # et exige `result == success`).
  workflow_call:
    inputs:
      monorepo_ref:
        description: "Branche (ou tag/SHA) du monorepo à tester"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: watch-tests-${{ inputs.monorepo_ref || github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    # Même famille de runner que l'iOS build (Xcode 27.1, SDK watchOS 11+).
    # Le socle (choix du runner) n'est pas nécessaire ici : `swift test`
    # macOS compile le paquet avec Swift 5.9+ ; pas de dépendance au SDK iOS.
    runs-on: xcode-27
    timeout-minutes: 20
    # Les secrets `MONOREPO_REPO` + `CI_PAT_TOKEN` sont scopés à l'environnement
    # `production` (mêmes règles que l'iOS build).
    environment: production

    steps:
      # Checkout du monorepo via le même PAT que le build iOS. L'app vit dans
      # `app/apps/mobile/watch-core`.
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          ref: ${{ inputs.monorepo_ref }}

      - name: Trace du commit testé
        run: |
          echo "Commit monorepo : $(git -C app rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          swift --version | tee -a "$GITHUB_STEP_SUMMARY"

      # Icônes Lucide de la montre : imagesets, copie JSON et enum Swift doivent
      # être alignés sur scripts/lucide-watch-icons.json. Seules les dépendances
      # de la racine (svgo, lucide-static) sont installées : pas tout le monorepo.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (Node 20)
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Vérifier que les icônes Lucide sont à jour
        working-directory: app
        run: |
          pnpm install --frozen-lockfile --filter meschasses
          pnpm gen:lucide-watch-icons --check

      - name: swift test --package-path apps/mobile/watch-core
        working-directory: app
        run: |
          # pipefail : sans ça, `tee` renvoie 0 et un échec de `swift test`
          # passe inaperçu (vécu le 2026-10-27, run 40588312474).
          set -o pipefail
          swift test --package-path apps/mobile/watch-core 2>&1 | tee "$GITHUB_STEP_SUMMARY"

  # Compile les cibles watchOS (app montre + complications) sans signing ni
  # upload. Objectif : valider à chaque PR qui touche aux sources Swift que
  # les cibles réelles compilent toujours — garantie que l'iOS TestFlight (le
  # jour où watch=true sera activé) ne pétera pas sur un symbole / une arch /
  # un fichier manquant. Ce job valide aussi au passage les contrats @MainActor
  # côté PhoneLink (Tâche 5) qu'un `swift test` sur macOS ne voit pas.
  watch-build:
    runs-on: xcode-27
    # 90 min : même borne d'alerte que le build iOS. L'essentiel du budget
    # part en pod install (cache froid) et compile des Pods RN la toute
    # première fois ; les runs suivants sont bornés par la compilation Swift
    # des cibles watchOS (~5-10 min).
    timeout-minutes: 90
    environment: production

    # Variables communes à tous les steps du job qui touchent aux pods ou à
    # xcodebuild. Deux rôles :
    #
    #  1) Forcer React Native à utiliser les ARTIFACTS PREBUILT (xcframework
    #     côté Dependencies, xcframework côté React-Core). Sans ces drapeaux,
    #     `pod install` tente de bâtir RN et ses dépendances C++ depuis les
    #     sources — à chaque run, sur chaque arch, pour chaque Pod. En mode
    #     prebuilt, pod télécharge un tarball une fois, le valide par SHA1,
    #     et REUTILISE le fichier posé dans `~/Library/Caches/ReactNative/`
    #     à chaque invocation ultérieure (code source :
    #     facebook/react-native@0a83e72 scripts/cocoapods/rndependencies.rb
    #     et sdks/hermes-engine/hermes-utils.rb — tous deux utilisent le
    #     même dossier `~/Library/Caches/ReactNative`).
    #  2) Activer le MIROIR Maven côté RN. L'URL d'origine (`repo1.maven.org`)
    #     a été instable sur plusieurs runs (`curl 56` / `curl 92`) ; le
    #     miroir `repo.reactnative.dev` est explicitement supporté par
    #     `ReactNativePodsUtils.maven_repository_urls` quand `RCT_REACT_NATIVE_
    #     MAVEN_MIRROR_ENABLED=1` (idem commit `0a83e72`).
    #  3) `RCT_SKIP_CACHES=0` : on VEUT que RN consulte et peuple
    #     `~/Library/Caches/ReactNative` — c'est précisément le dossier
    #     qu'`actions/cache` persiste entre runs.
    env:
      RCT_USE_PREBUILT_RNCORE: "1"
      RCT_USE_RN_DEP: "1"
      RCT_REACT_NATIVE_MAVEN_MIRROR_ENABLED: "1"
      RCT_SKIP_CACHES: "0"

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          ref: ${{ inputs.monorepo_ref }}

      - name: Trace du commit testé
        run: |
          echo "Commit monorepo : $(git -C app rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode 27.1
        run: |
          XCODE_PATH=/Applications/Xcode_27.1.app
          [ -d "$XCODE_PATH" ] || { echo "::error::Xcode 27.1 introuvable ($XCODE_PATH)"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Télécharger le runtime watchOS si manquant
        # Xcode 27.1 sur ce runner ne vient plus avec le runtime watchOS préinstallé
        # (run 40969326562 des captures a échoué avec « Aucun runtime watchOS
        # disponible »). On le télécharge au besoin pour que `watch-captures.sh`
        # puisse créer ses devices et prendre ses captures de contrôle.
        run: |
          set -o pipefail
          if xcrun simctl list runtimes watchOS -j | node -e '(() => {
            const r = JSON.parse(require("fs").readFileSync(0,"utf8")).runtimes || [];
            if (r.filter(x => x.isAvailable !== false).length === 0) process.exit(2);
          })()'; then
            echo "runtime watchOS déjà disponible" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "## Téléchargement du runtime watchOS" | tee -a "$GITHUB_STEP_SUMMARY"
            xcodebuild -downloadPlatform watchOS 2>&1 | tail -5 | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::téléchargement du runtime watchOS a échoué"
            xcrun simctl list runtimes watchOS | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (Node 20)
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-watch-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pods-watch-${{ runner.os }}-

      # Cache des artifacts prebuilt de React Native (xcframeworks de
      # ReactNativeDependencies et hermes-engine). Même dossier des deux côtés
      # (voir en-tête `env:`). Clé = hash du pnpm-lock + chemin natif, pour
      # qu'une bump de version RN change la clé et force un nouveau cache
      # (le podspec vérifie le SHA1, un vieux cache serait rejeté de toute
      # façon mais autant éviter l'aller-retour).
      - name: Cache React Native prebuilt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/ReactNative
          key: rn-prebuilt-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            rn-prebuilt-${{ runner.os }}-

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Prebuild Expo avec MESCHASSES_WATCH=1 pour que app.config.js étende le
      # glob @bacons/apple-targets aux cibles `watch` et `watch-widget`, et que
      # `withWatchCoreSources` copie les sources partagées dans chaque cible.
      # On ne pousse PAS plus loin que la génération du projet Xcode + pods :
      # pas de signing, pas d'archive, pas d'upload.
      - name: Expo prebuild (iOS, MESCHASSES_WATCH=1)
        working-directory: app/apps/mobile
        env:
          MESCHASSES_WATCH: "1"
          # Bundle id partagé avec l'app live : ne pas resyncer les capabilities.
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          npx expo prebuild --platform ios --no-install --non-interactive --clean

      # pod install : trois sources d'échec rencontrées sur les runs
      # précédents (40649859890, 40660281899, 40663168061) :
      #   • CDN GitHub artifacts (`React-Core-prebuilt`) qui coupe au milieu
      #     du téléchargement (`curl: (56) Recv failure`).
      #   • Miroir Maven RN (`repo.reactnative.dev`) qui ferme un stream HTTP/2
      #     avant la fin (`curl: (92) HTTP/2 stream 1 not closed cleanly`).
      #   • Téléchargement de `react-native-artifacts` qui ne finit JAMAIS
      #     (run 40663168061 : 45 min sans sortie, timeout du job).
      #
      # Les deux premiers sont rejoués ici par la boucle (3 tentatives).
      # Le troisième est désamorcé par les trois mécanismes posés plus haut :
      # miroir activé (le podspec essaie `repo1.maven.org` ET
      # `repo.reactnative.dev`), artifacts cachés entre runs
      # (`~/Library/Caches/ReactNative` dans `actions/cache`), et par la
      # suppression de `--repo-update` qui déclenchait un pull de tous les
      # podspecs à chaque run.
      - name: pod install
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          for i in 1 2 3; do
            if pod install; then
              echo "pod install OK à la tentative $i" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "pod install a échoué (tentative $i/3), nouvelle tentative dans 30s..."
            sleep 30
          done
          echo "::error::pod install a échoué 3 fois (voir logs plus haut : CDN RN)"
          exit 1

      # xcodebuild build des cibles watchOS. CODE_SIGNING_ALLOWED=NO : on
      # cherche à vérifier que ça compile, pas à produire un binaire signé.
      # `-sdk watchsimulator` évite d'avoir à sélectionner un simulateur
      # précis par son UDID.
      #
      # Pas de workspace ni de scheme : on cible le project `MesChasses.xcodeproj`
      # directement avec `-target …`. Autrement, le scheme MesChassesWatch
      # (généré par @bacons/apple-targets) trimballe toutes les dépendances
      # des Pods du projet (RN, MapLibre, Firebase, etc.) et le build dépasse
      # 45 min. Les cibles watchOS ne lient AUCUN de ces pods — un build
      # ciblé sur le target natif coupe le chemin critique.
      #
      # Deux xcodebuild distincts avec `SYMROOT` SÉPARÉS plutôt qu'un seul :
      # on veut que CHAQUE cible compile indépendamment, pour qu'une régression
      # sur `Complications.swift` ne passe pas inaperçue au prétexte que l'app
      # watch l'embarque. Chaque build écrit dans son propre dossier (
      # `build-app/` et `build-complications/`), pas de clean/collision
      # possible, et la vérif inspecte précisément les binaires de CHAQUE cible.
      - name: xcodebuild build — MesChassesWatch (app montre)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-app" \
            OBJROOT="$PWD/build-app/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      # Contrôle de l'Info.plist de l'app montre COMPILÉE (pas celui du dépôt) :
      # la flèche vers le poste lit la position, et watchOS tue l'app sans
      # `NSLocationWhenInUseUsageDescription`. `WKCompanionAppBundleIdentifier`
      # (injecté par @bacons/apple-targets via INFOPLIST_KEY_*) doit pointer sur
      # l'app iPhone `com.meschasses`, sinon l'installation couplée échoue.
      # On vérifie aussi que le texte d'usage est localisé FR + EN
      # (InfoPlist.xcstrings compilé en <langue>.lproj/InfoPlist.strings).
      - name: Contrôle Info.plist de l'app montre (position + app compagnon)
        working-directory: app/apps/mobile/ios
        run: |
          set -uo pipefail
          APP="build-app/Debug-watchsimulator/MesChassesWatch.app"
          PLIST="$APP/Info.plist"
          [ -f "$PLIST" ] || { echo "::error::Info.plist introuvable : $PLIST"; exit 1; }

          {
            echo "## Info.plist de l'app montre compilée"
            echo '```'
            plutil -p "$PLIST"
            echo '```'
            echo "### Localisations embarquées"
            echo '```'
            find "$APP" -name "*.strings" -o -name "*.lproj" | sort
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          fail=0
          KEY=NSLocationWhenInUseUsageDescription
          if ! plutil -extract "$KEY" raw -o - "$PLIST" >/dev/null 2>&1; then
            echo "::error::$KEY absente de l'Info.plist de l'app montre"
            fail=1
          fi
          COMPANION=$(plutil -extract WKCompanionAppBundleIdentifier raw -o - "$PLIST" 2>/dev/null || true)
          if [ "$COMPANION" != "com.meschasses" ]; then
            echo "::error::WKCompanionAppBundleIdentifier = '${COMPANION}' (attendu : com.meschasses)"
            fail=1
          fi

          check_lang() {
            local lang="$1" expected="$2" f="$APP/$1.lproj/InfoPlist.strings" got
            if [ ! -f "$f" ]; then
              echo "::error::$f manquant (texte d'usage non localisé en $lang)"
              fail=1
              return
            fi
            echo "--- $f"; plutil -p "$f"
            got=$(plutil -extract "$KEY" raw -o - "$f" 2>/dev/null || true)
            if [ "$got" != "$expected" ]; then
              echo "::error::$lang : '${got}' (attendu : '${expected}')"
              fail=1
            fi
          }
          check_lang fr "Mes Chasses utilise votre position pour vous guider jusqu'à votre poste."
          check_lang en "Mes Chasses uses your location to guide you to your post."

          # Textes HealthKit (Tâche 6) : NSHealthShareUsageDescription + NSHealthUpdateUsageDescription,
          # localisés FR + EN. Même mécanisme que la position (InfoPlist.xcstrings).
          check_lang_key() {
            local lang="$1" key="$2" expected="$3" f="$APP/$1.lproj/InfoPlist.strings" got
            if [ ! -f "$f" ]; then
              echo "::error::$f manquant (clé $key non localisée en $lang)"
              fail=1
              return
            fi
            got=$(plutil -extract "$key" raw -o - "$f" 2>/dev/null || true)
            if [ "$got" != "$expected" ]; then
              echo "::error::$lang / $key : '${got}' (attendu : '${expected}')"
              fail=1
            fi
          }
          check_lang_key fr NSHealthShareUsageDescription "Mes Chasses utilise la séance de battue pour garder la montre active. Rien n'est lu dans Santé."
          check_lang_key en NSHealthShareUsageDescription "Mes Chasses uses the hunt workout to keep the watch awake. Nothing is read from Health."
          check_lang_key fr NSHealthUpdateUsageDescription "Mes Chasses garde la montre active en battue. Santé reçoit la séance si vous activez le réglage."
          check_lang_key en NSHealthUpdateUsageDescription "Mes Chasses keeps the watch awake on a drive. Health gets the workout if you turn on the setting."

          # WKBackgroundModes (clé watchOS ; UIBackgroundModes est refusée à l'envoi, 90362) doit porter workout-processing (sinon HKWorkoutSession ne tient pas
          # écran éteint — le mode battue devient inutile).
          BG=$(plutil -extract WKBackgroundModes json -o - "$PLIST" 2>/dev/null || echo "")
          case "$BG" in
            *workout-processing*) ;;
            *)
              echo "::error::WKBackgroundModes ne contient pas workout-processing (got: ${BG:-<vide>})"
              fail=1
              ;;
          esac

          [ "$fail" -eq 0 ] || exit 1
          echo "Contrôle Info.plist montre : OK" | tee -a "$GITHUB_STEP_SUMMARY"

      # Contrôle des entitlements compilés (Tâche 6).
      # Pourquoi NE PAS utiliser `codesign -d --entitlements` : la cible watch est
      # construite ici en CODE_SIGNING_ALLOWED=NO (pas de signature → `codesign` renvoie
      # "code object is not signed at all"). On inspecte à la place le fichier
      # `.entitlements` fourni au build (celui que @bacons/apple-targets a généré depuis
      # expo-target.config.js) : chemin via `xcodebuild -showBuildSettings`.
      - name: Contrôle entitlement HealthKit (watch)
        working-directory: app/apps/mobile/ios
        run: |
          set -uo pipefail
          # Résout CODE_SIGN_ENTITLEMENTS de la cible watch (chemin relatif au projet Xcode).
          ENT_REL=$(xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -showBuildSettings 2>/dev/null \
            | awk -F' = ' '/^ *CODE_SIGN_ENTITLEMENTS/ {print $2; exit}')
          echo "CODE_SIGN_ENTITLEMENTS = ${ENT_REL:-<vide>}"
          if [ -z "$ENT_REL" ]; then
            echo "::error::Aucun CODE_SIGN_ENTITLEMENTS déclaré pour MesChassesWatch"
            exit 1
          fi
          ENT_PATH="$ENT_REL"
          [ -f "$ENT_PATH" ] || ENT_PATH="$PWD/$ENT_REL"
          [ -f "$ENT_PATH" ] || {
            echo "::error::Fichier d'entitlements introuvable : $ENT_REL"
            find . -maxdepth 4 -name '*.entitlements' | head -20
            exit 1
          }
          {
            echo "## Entitlements (watch)"
            echo '```'
            plutil -p "$ENT_PATH"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # plutil utilise `.` comme séparateur de chemin de clé — les points DANS
          # le nom de la clé doivent être échappés avec `\.`. Sans ça, la sortie est
          # vide même si la clé est bel et bien présente (vécu run 40895713403).
          HK=$(plutil -extract 'com\.apple\.developer\.healthkit' raw -o - "$ENT_PATH" 2>/dev/null || echo "")
          if [ "$HK" != "true" ] && [ "$HK" != "1" ]; then
            echo "::error::com.apple.developer.healthkit absent ou faux dans $ENT_REL (got: ${HK:-<vide>})"
            exit 1
          fi
          echo "Entitlement HealthKit : OK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: xcodebuild build — MesChassesWatchComplications (complications)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatchComplications \
            -configuration Debug \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-complications" \
            OBJROOT="$PWD/build-complications/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      # Compilation RELEASE des deux cibles montre (simulateur, sans signature).
      # Le code de capture (`-demo`, `-screen`, `scrollToActionsOnAppear`…) vit
      # sous `#if DEBUG` : une garde mal placée ne casse que le build Release,
      # donc invisible aux builds Debug ci-dessus et découverte seulement au
      # TestFlight. On la détecte ici, avant. SYMROOT séparés (rien à voir avec
      # les binaires Debug vérifiés plus bas).
      - name: xcodebuild build Release — MesChassesWatch (app montre)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatch \
            -configuration Release \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-app-release" \
            OBJROOT="$PWD/build-app-release/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      - name: xcodebuild build Release — MesChassesWatchComplications (complications)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MesChasses.xcodeproj \
            -target MesChassesWatchComplications \
            -configuration Release \
            -sdk watchsimulator \
            -skipPackagePluginValidation \
            SYMROOT="$PWD/build-complications-release" \
            OBJROOT="$PWD/build-complications-release/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -200

      # Vérification explicite que les DEUX cibles ont bien produit un binaire
      # non trivial, pas seulement une archive propre.
      #
      # Trois contrôles par cible :
      #   1. Le binaire existe (sinon on dump l'arborescence pour diagnostic).
      #   2. Ses archs couvrent arm64 (watchOS simulateur sur Apple Silicon)
      #      ET x86_64 (watchOS simulateur sur Intel) — soit la couverture
      #      universelle attendue pour un build Debug sans ONLY_ACTIVE_ARCH.
      #   3. Un `.swiftmodule/<arch>-apple-watchos-simulator.swiftmodule` a
      #      bien été produit à côté — c'est la preuve DIRECTE que du code
      #      Swift propre à la target a été compilé (sinon xcodebuild aurait
      #      produit un binaire vide par pur héritage).
      - name: Vérification des binaires watchOS produits
        working-directory: app/apps/mobile/ios
        run: |
          set -euo pipefail

          verify() {
            local label="$1"
            local build_dir="$2"
            local product_bundle="$3"
            local module_name="$4"

            local binary="$build_dir/Debug-watchsimulator/$product_bundle/$module_name"
            local swiftmodule_dir="$build_dir/Debug-watchsimulator/$module_name.swiftmodule"

            echo "### $label" >> "$GITHUB_STEP_SUMMARY"

            if [ ! -f "$binary" ]; then
              echo "::error::Binaire manquant : $binary"
              echo "**Arborescence $build_dir** (max 4 niveaux)" >> "$GITHUB_STEP_SUMMARY"
              find "$build_dir" -maxdepth 4 2>&1 | head -40 >> "$GITHUB_STEP_SUMMARY" || true
              exit 1
            fi
            local size archs
            size=$(stat -f%z "$binary")
            archs=$(xcrun lipo -archs "$binary" 2>/dev/null || echo "?")
            echo "- binaire : $binary ($size octets, archs: $archs)" >> "$GITHUB_STEP_SUMMARY"

            # arm64 + x86_64 attendus pour un build watchsimulator sans ONLY_ACTIVE_ARCH.
            for arch in arm64 x86_64; do
              if ! echo "$archs" | tr ' ' '\n' | grep -qx "$arch"; then
                echo "::error::Arch $arch absente de $binary (lipo -archs : $archs)"
                exit 1
              fi
            done
            echo "- archs attendues (arm64 + x86_64) : présentes ✓" >> "$GITHUB_STEP_SUMMARY"

            # Un .swiftmodule par arch à côté → preuve que du Swift de la target a été compilé.
            if [ ! -d "$swiftmodule_dir" ]; then
              echo "::error::$swiftmodule_dir manquant — xcodebuild n'a pas produit de swiftmodule pour cette target"
              exit 1
            fi
            local modules
            modules=$(ls -1 "$swiftmodule_dir" | grep -E "watchos-simulator\.swiftmodule$" | wc -l | tr -d ' ')
            if [ "$modules" -lt 2 ]; then
              echo "::error::$swiftmodule_dir n'a que $modules .swiftmodule (attendu ≥ 2, un par arch)"
              ls -la "$swiftmodule_dir" >> "$GITHUB_STEP_SUMMARY" || true
              exit 1
            fi
            echo "- $modules .swiftmodule compilés dans $swiftmodule_dir ✓" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "## Vérification des cibles watchOS" >> "$GITHUB_STEP_SUMMARY"
          verify "App montre (MesChassesWatch)" \
            "build-app" \
            "MesChassesWatch.app" \
            "MesChassesWatch"

          verify "Complications (MesChassesWatchComplications)" \
            "build-complications" \
            "MesChassesWatchComplications.appex" \
            "MesChassesWatchComplications"

      # Scripts CI de CE repo (public) : checkout sans token, dans ci/.
      # Nécessaire pour `watch-captures.sh` qui vit dans ce dépôt-ci.
      - name: Checkout scripts CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ci

      # 60 captures (3 tailles × 2 langues × 10 écrans — matrice `-demo` + `-screen`
      # dans DemoMode.swift). Lance le simulateur, installe le .app Debug déjà
      # bâti, puis itère. Simulateurs créés à la volée et supprimés en fin de
      # step. `timeout-minutes: 30` : borne dure si le CoreSimulatorService
      # part en vrille (vécu run 40716075617 : hang indéfini du bootstatus).
      - name: Captures simulateur watchOS (60 captures)
        working-directory: app/apps/mobile/ios
        timeout-minutes: 30
        env:
          WATCH_APP_PATH: ${{ github.workspace }}/app/apps/mobile/ios/build-app/Debug-watchsimulator/MesChassesWatch.app
          OUTDIR: ${{ github.workspace }}/watch-captures
        run: bash "${{ github.workspace }}/ci/.github/scripts/watch-captures.sh"

      - name: Upload artifact watch-captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-captures
          path: watch-captures/*.png
          if-no-files-found: error
          retention-days: 30
