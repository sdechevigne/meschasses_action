name: Wear OS Play

# App Wear OS « Mes Chasses » (Kotlin, apps/wearos du monorepo) : build release
# signé via Gradle (image Docker Android épinglée du monorepo), envoi sur la piste
# wear:internal de Google Play. Modelé sur expo-android-play.yml.
# versionCode = 3 000 000 + github.run_number (le téléphone utilise 2 100 000 +
# son run_number : aucun croisement possible).
# Clé de signature : SECRETS ANDROID_KEYSTORE_* (mêmes que l'app téléphone, Play
# App Signing partage le même package com.meschasses).

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "Branche (ou SHA complet) du monorepo à construire — vide = branche par défaut"
        required: false
        default: ""
      track:
        description: "Piste Google Play Wear OS cible"
        type: choice
        options:
          - "wear:internal"
          - "wear:alpha"
          - "wear:beta"
          - "wear:production"
        default: "wear:internal"

# Repo PUBLIC : le GITHUB_TOKEN n'est utilisé par aucun step du job. Un seul
# `permissions: {}` au niveau workflow suffit — pas de redondance au niveau job.
permissions: {}

# Deux dispatches concurrents sur la même piste s'annulent ; une publication en
# cours sur une piste différente ne les touche pas.
concurrency:
  group: wearos-play-${{ inputs.track || 'wear:internal' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      # Checkout du monorepo (apps/wearos) via le PAT dédié.
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ secrets.MONOREPO_REPO }}
          token: ${{ secrets.CI_PAT_TOKEN }}
          path: app
          # Vide = branche par défaut du monorepo. Passé via `with:` → pas d'injection shell.
          ref: ${{ inputs.monorepo_ref }}

      # Scripts CI de CE repo (public) : checkout sans token.
      - name: Checkout scripts CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ci

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Clé de service Google Play (secret) : utilisée en lecture AVANT build pour
      # garantir que le versionCode choisi dépasse tous ceux déjà présents sur la
      # fiche (toutes pistes confondues). Si la garde échoue, on n'a consommé ni
      # minutes de build ni numéro de build (fail-fast).
      - name: Compute build number
        env:
          OFFSET: "3000000"
        run: |
          BN=$(( ${{ github.run_number }} + OFFSET ))
          echo "VERSION_CODE=$BN" >> "$GITHUB_ENV"

      # Garde-fou : versionCode projeté > max déjà présent sur la fiche (toutes
      # pistes). Vérifie aussi que la piste Wear OS est joignable (format Wear OS
      # activé dans la fiche). Mode CHECK_ONLY : rien publié, pas d'edit laissé.
      - name: Contrôles Play (versionCode + piste wear:internal)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          PLAY_TRACK: ${{ inputs.track }}
          CHECK_ONLY: "1"
        run: node ci/.github/scripts/publish-google-play-wearos-track.mjs

      # Clé d'upload Android : matérialisée dans apps/wearos/release.keystore (gitignoré
      # dans le monorepo). Mêmes 4 secrets que expo-android-play.yml (Play App Signing
      # partagé — package com.meschasses commun à toutes les variantes de l'app).
      # Fallback côté app : si `WEAROS_KEY_PASSWORD` manque, `app/build.gradle.kts` retombe
      # sur `WEAROS_KEYSTORE_PASSWORD` (clé upload Mes Chasses : les deux mots de passe sont
      # identiques dans Play App Signing). Ici on garde les 4 secrets séparés, par symétrie
      # avec le workflow téléphone, pour qu'un futur rotation de l'un seul reste possible.
      - name: Write Android upload keystore
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          [ -n "$ANDROID_KEYSTORE_FILE" ] || { echo "::error::ANDROID_KEYSTORE_FILE manquant"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD manquant"; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS manquant"; exit 1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "::error::ANDROID_KEY_PASSWORD manquant"; exit 1; }
          echo "$ANDROID_KEYSTORE_FILE" | base64 -d > app/apps/wearos/release.keystore
          test -s app/apps/wearos/release.keystore

      # Injection du versionCode dans build.gradle.kts : les lignes "versionCode = 1"
      # (defaultConfig) et "versionName" sont réécrites par sed. Le versionName suit
      # pour l'affichage, pas pour l'ordre.
      - name: Inject versionCode / versionName
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -e
          sed -i "s/^\\(\\s*\\)versionCode = .*/\\1versionCode = ${VERSION_CODE}/" app/apps/wearos/app/build.gradle.kts
          sed -i "s/^\\(\\s*\\)versionName = .*/\\1versionName = \"${VERSION_NAME}\"/" app/apps/wearos/app/build.gradle.kts
          # Vérifie que l'injection a réellement eu lieu : si sed n'a rien remplacé (ancre
          # modifiée, fichier déplacé), on sort en erreur AVANT d'engager un build long.
          grep -E "^\\s*versionCode = ${VERSION_CODE}$" app/apps/wearos/app/build.gradle.kts \
            || { echo "::error::versionCode non injecté dans build.gradle.kts"; exit 1; }
          grep -E "^\\s*versionName = \"${VERSION_NAME}\"$" app/apps/wearos/app/build.gradle.kts \
            || { echo "::error::versionName non injecté dans build.gradle.kts"; exit 1; }
          echo "RELEASE_NAME=${VERSION_NAME} (${VERSION_CODE})" >> "$GITHUB_ENV"

      # Build release signé via wear.sh (image Docker Android épinglée, cache Gradle
      # dans un volume Docker). Les 4 variables WEAROS_* sont consommées par
      # app/build.gradle.kts (signingConfig release). Le keystore est à l'intérieur
      # du dépôt → chemin relatif au module app (release.keystore à la racine wearos).
      #
      # Télémétrie / crash reporting (BET-wearos-telemetry) :
      #  - WEAROS_SENTRY_DSN : même projet Sentry que l'app téléphone (EXPO_PUBLIC_SENTRY_DSN
      #    côté mobile) ; `MesChassesSentry.init` est no-op si vide, donc le DSN ne finit
      #    jamais dans un APK debug ou un build local. Un tag `platform=wearos` est posé
      #    côté client pour séparer les événements des deux apps dans Sentry.
      #  - SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT : lus par le plugin Gradle
      #    Sentry pour TÉLÉVERSER le fichier de correspondance R8 (`mapping.txt`). Si l'un
      #    des trois manque, le plugin désactive l'upload tout seul (`includeProguardMapping`
      #    + `autoUploadProguardMapping` sont posés sur `sentryAuthToken.isNotEmpty()`).
      - name: Build bundleRelease signé
        env:
          CI: "1"
          WEAROS_KEYSTORE_FILE: ../release.keystore
          WEAROS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WEAROS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WEAROS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WEAROS_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        working-directory: app
        run: |
          set -e
          apps/wearos/scripts/wear.sh build :app:bundleRelease
          test -f apps/wearos/app/build/outputs/bundle/release/app-release.aab

      # bundletool épinglé (version + empreinte) : utilisé par verifier-minimums.mjs
      # pour contrôler que l'.aab livre bien minSdk 30 (Wear OS 3+).
      - name: Installer bundletool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -

      - name: Contrôle minSdk (.aab Wear OS)
        env:
          MIN_ANDROID: "30"
        run: node ci/.github/scripts/verifier-minimums.mjs android app/apps/wearos/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/bundletool.jar"

      - name: Envoi sur la piste Wear OS Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          AAB_PATH: app/apps/wearos/app/build/outputs/bundle/release/app-release.aab
          PLAY_TRACK: ${{ inputs.track }}
          # Nom de la release visible dans la console Play : « versionName (versionCode) »,
          # même convention que le workflow téléphone (expo-android-play.yml) : repère
          # univoque pour relier une release Play à son run CI.
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
        run: node ci/.github/scripts/publish-google-play-wearos-track.mjs

      # Nettoyage : .aab, keystore, cache Gradle local (le vrai cache vit dans un
      # volume Docker, inaccessible après la fin du conteneur).
      - name: Wipe build outputs and secrets
        if: always()
        run: rm -f app/apps/wearos/release.keystore app/apps/wearos/app/build/outputs/bundle/release/app-release.aab
